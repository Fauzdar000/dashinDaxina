
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#641b16">
    <title>Dashain Tika & Dakshina</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Floating Background Elements -->
    <div class="floating-bg" aria-hidden="true">
        <span class="floating-item kite-1">🪁</span>
        <span class="floating-item flower-1">🌸</span>
        <span class="floating-item kite-2">🪁</span>
        <span class="floating-item flower-2">🌼</span>
        <span class="floating-item kite-3">🪁</span>
        <span class="floating-item flower-3">🌷</span>
    </div>

    <!-- Main Container -->
    <main class="container">

        <div class="content">
            <header class="header">
                <p class="eyebrow">🌾 शुभ विजयादशमी 🌾</p>
                <h1>Happy Dashain!</h1>
                <p class="subtitle">
                    Your blessings make my Dashain special ❤️
                </p>
            </header>

            <!-- QR Code -->
            <div class="qr-scan">
                <img
                    src="./qrcode.jpeg"
                    alt="Scan this QR code to send Dashain Dakshina"
                >
            </div>

            <p class="text">
                Scan the QR • Send some love
                <br>
                Make my Dashain special! 🎁
            </p>

            <p class="footer-text">
                Your little Dakshina means a lot to me 🥰
                <br>
                — Your brother, Sugam ❤️
            </p>
        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
